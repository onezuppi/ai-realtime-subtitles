<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Subtitles</title>
    <style>
      body { width: 260px; margin: 12px; font: 14px system-ui, sans-serif; }
      label { display: block; margin: 8px 0 2px; font-size: 12px; opacity: .7; }
      select, button { width: 100%; padding: 6px; box-sizing: border-box; }
      button { margin-top: 12px; }
      #state { margin-top: 8px; font-size: 12px; min-height: 1.4em; }
    </style>
  </head>
  <body>
    <label for="mode">Mode</label>
    <select id="mode">
      <option value="http">Program on this computer (HTTP)</option>
      <option value="native" disabled>Program via bridge (soon)</option>
      <option value="browser" disabled>Browser only (soon)</option>
    </select>
    <label for="lang">Translate to</label>
    <select id="lang">
      <option value="en">English</option>
      <option value="ru">Russian</option>
    </select>
    <button id="toggle">Start</button>
    <div id="state"></div>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
